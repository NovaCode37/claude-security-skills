<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Claude Security Skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#11182b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2740" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)" opacity="0.35"/>
  <rect x="1" y="1" width="1278" height="338" rx="19" fill="none" stroke="#243150" stroke-width="2"/>

  <!-- decorative scan line (starts after the shield so it doesn't cross it) -->
  <rect x="300" y="262" width="880" height="2" fill="url(#accent)" opacity="0.22"/>

  <!-- Shield emblem -->
  <g transform="translate(96,90)" filter="url(#glow)">
    <path d="M82 0 L150 26 V92 C150 140 120 168 82 184 C44 168 14 140 14 92 V26 Z"
          fill="url(#shieldGrad)" opacity="0.18"/>
    <path d="M82 0 L150 26 V92 C150 140 120 168 82 184 C44 168 14 140 14 92 V26 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="3"/>
    <path d="M54 94 l20 22 l40 -52" fill="none" stroke="url(#shieldGrad)"
          stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="300" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="62" font-weight="800" fill="#e8eefc">Claude Security Skills</text>

  <!-- Tagline -->
  <text x="302" y="178" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="25" fill="#9fb3d1">Turn Claude Code into a security toolkit — just ask in plain English.</text>

  <!-- Skill chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600">
    <g transform="translate(302,210)">
      <rect width="186" height="40" rx="20" fill="#0e1830" stroke="#2b3a5e"/>
      <circle cx="24" cy="20" r="6" fill="#34d399"/>
      <text x="42" y="26" fill="#cdd9ef">secret-scanner</text>
    </g>
    <g transform="translate(500,210)">
      <rect width="132" height="40" rx="20" fill="#0e1830" stroke="#2b3a5e"/>
      <circle cx="24" cy="20" r="6" fill="#22d3ee"/>
      <text x="42" y="26" fill="#cdd9ef">sast-lite</text>
    </g>
    <g transform="translate(644,210)">
      <rect width="262" height="40" rx="20" fill="#0e1830" stroke="#2b3a5e"/>
      <circle cx="24" cy="20" r="6" fill="#a78bfa"/>
      <text x="42" y="26" fill="#cdd9ef">prompt-injection-tester</text>
    </g>
    <g transform="translate(918,210)">
      <rect width="190" height="40" rx="20" fill="#0e1830" stroke="#2b3a5e"/>
      <circle cx="24" cy="20" r="6" fill="#f59e0b"/>
      <text x="42" y="26" fill="#cdd9ef">http-sec-audit</text>
    </g>
  </g>

  <!-- right-side meta -->
  <g font-family="'JetBrains Mono','Consolas',monospace" font-size="16" fill="#5f7397">
    <text x="1180" y="40" text-anchor="end">$ stdlib-only</text>
    <text x="1180" y="64" text-anchor="end">$ 114 tests · CI green</text>
  </g>
</svg>
